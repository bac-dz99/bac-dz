name: Build BAC DZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Capacitor config
        run: |
          npx cap init "BAC DZ" "dz.bac.bacdz" --web-dir www

      - name: Add Android
        run: |
          npx cap add android

      - name: Copy web app
        run: |
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BAC-DZ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
